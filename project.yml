name: VoiceNote
options:
  bundleIdPrefix: com.hmb269
  deploymentTarget:
    iOS: "18.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.19
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 2.0.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual

targets:
  VoiceNote:
    type: application
    platform: iOS
    sources:
      - path: VoiceNote
    info:
      path: Support/VoiceNote-Info.plist
      properties:
        CFBundleDisplayName: 汀汀
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: 录音需要使用麦克风
        NSSpeechRecognitionUsageDescription: 用苹果的语音识别把录音转成文字
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mpeg-4-audio
              - com.apple.m4a-audio
              - public.mp3
              - com.microsoft.waveform-audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hmb269.voicenote
        PRODUCT_NAME: VoiceNote
        SWIFT_OBJC_BRIDGING_HEADER: Support/Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: libbz2.tbd
      - package: SherpaOnnx
        product: sherpa-onnx
      - package: ZIPFoundation
      - target: VoiceNoteWatch
        embed: true
        codeSign: false

  VoiceNoteWatch:
    type: application
    platform: watchOS
    sources:
      - path: VoiceNoteWatch
    info:
      path: Support/VoiceNoteWatch-Info.plist
      properties:
        CFBundleDisplayName: 汀汀
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.hmb269.voicenote
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: 录音需要使用麦克风
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hmb269.voicenote.watchkitapp
        PRODUCT_NAME: VoiceNoteWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

schemes:
  VoiceNote:
    build:
      targets:
        VoiceNote: all
        VoiceNoteWatch: all
    run:
      config: Debug
    archive:
      config: Release
